version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: commitcast_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  bot:
    build: .
    container_name: commitcast_bot
    restart: unless-stopped
    depends_on:
      - mongodb
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    volumes:
      - ./data:/app/data

volumes:
  mongo_data:
